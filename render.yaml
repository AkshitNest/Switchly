# Switchly — Render Free-Tier Blueprint
# Zero-budget demo deployment: Render Free + Supabase Free
#
# Before deploying:
#   1. Create a Supabase free project and run the least-privilege role setup
#      (see FREE_DEPLOYMENT_PLAN.md Section 3.1).
#   2. Obtain the session-mode pooler connection string from Supabase Dashboard.
#   3. Set all env vars marked sync:false as Secret environment variables
#      in the Render Dashboard before the first deploy.
#
# Architecture:
#   switchly-web  (Node 24 gateway + React SPA)
#     → server-to-server → switchly-api (Spring Boot 4)
#     → JDBC/TLS → Supabase PostgreSQL (session pooler)

services:
  # ── Spring Boot API ─────────────────────────────────────────────────────────
  - type: web
    name: switchly-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /healthz

    envVars:
      # JVM memory bounds — empirically verified to stay within 512 MB
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:+UseContainerSupport
          -XX:MaxRAMPercentage=55.0
          -XX:InitialRAMPercentage=30.0
          -XX:MaxMetaspaceSize=128m
          -XX:ReservedCodeCacheSize=64m
          -XX:+ExitOnOutOfMemoryError
          -Djava.security.egd=file:/dev/./urandom

      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # HikariCP — keep pool small to avoid exhausting Supabase free connections
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"

      # Render injects PORT automatically; application.yaml reads ${PORT:8080}
      # No need to set PORT here.

      # ── Secret variables: set via Render Dashboard, not in this file ────────
      # SPRING_DATASOURCE_URL:
      #   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false

      # SPRING_DATASOURCE_USERNAME: switchly_app.<project-ref>
      - key: SPRING_DATASOURCE_USERNAME
        sync: false

      # SPRING_DATASOURCE_PASSWORD: switchly_app role password
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # SWITCHLY_JWT_SECRET: 64-char hex (openssl rand -hex 32)
      - key: SWITCHLY_JWT_SECRET
        sync: false

      # SWITCHLY_CORS_ALLOWED_ORIGINS: https://switchly-web.onrender.com
      - key: SWITCHLY_CORS_ALLOWED_ORIGINS
        sync: false

      # Rate limiting (defaults are safe — leave empty to use application.yaml defaults)
      - key: SWITCHLY_RATE_LIMIT_ENABLED
        value: "true"

  # ── Node Gateway + React SPA ─────────────────────────────────────────────────
  - type: web
    name: switchly-web
    runtime: docker
    rootDir: web
    plan: free
    healthCheckPath: /

    envVars:
      - key: NODE_ENV
        value: production

      # Required for HttpOnly cookie Secure flag on HTTPS
      - key: COOKIE_SECURE
        value: "true"

      # Dockerfile already sets HOST=0.0.0.0; Render overrides PORT
      - key: HOST
        value: "0.0.0.0"

      # Ollama AI drafts — leave empty; gateway returns 503 gracefully if unset
      - key: OLLAMA_ORIGIN
        value: ""

      # ── Secret variable: set via Render Dashboard ────────────────────────────
      # API_ORIGIN: https://switchly-api.onrender.com
      - key: API_ORIGIN
        sync: false
