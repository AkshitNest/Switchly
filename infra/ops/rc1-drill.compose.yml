# Local deployment rehearsal only. The extra API port is for acceptance fixtures.
services:
  edge:
    ports: !override ["127.0.0.1:18087:80", "127.0.0.1:18443:443"]
  api:
    ports: !override ["127.0.0.1:18088:8080"]
    environment:
      SWITCHLY_RATE_LIMIT_REGISTER_LIMIT: 500
      SWITCHLY_RATE_LIMIT_LOGIN_LIMIT: 500
      SWITCHLY_RATE_LIMIT_REFRESH_LIMIT: 500
      SWITCHLY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 1
