# Isolated local browser-test stack. Use with infra/docker-compose.yml and -p switchly-ui-test.
services:
  postgres:
    container_name: switchly-ui-test-db
    ports: !reset []
  api:
    container_name: switchly-ui-test-api
    image: switchly-api:ui-test
    ports: !override ["127.0.0.1:18086:8080"]
    environment:
      SWITCHLY_RATE_LIMIT_REGISTER_LIMIT: 500
      SWITCHLY_RATE_LIMIT_LOGIN_LIMIT: 500
      SWITCHLY_RATE_LIMIT_REFRESH_LIMIT: 500
      SWITCHLY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: 1
  web:
    ports: !override ["127.0.0.1:13086:3000"]
