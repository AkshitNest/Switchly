server:
  shutdown: graceful
  port: ${PORT:8080}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
      fail-on-reading-dup-tree-key: true
  application:
    name: switchly-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/switchly}
    username: ${SPRING_DATASOURCE_USERNAME:switchly}
    password: ${SPRING_DATASOURCE_PASSWORD:switchly}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      # NEVER allow Hibernate to create or modify tables; Flyway is the single source of truth
      ddl-auto: validate
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

switchly:
  jwt:
    # Signing secret must be provided via SWITCHLY_JWT_SECRET.
    # Accepts a 64-character hex string (256 bits) or UTF-8 string >= 32 bytes.
    secret: ${SWITCHLY_JWT_SECRET:}
    access-token-expiration-minutes: ${SWITCHLY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${SWITCHLY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

  rate-limit:
    evaluation-limit: ${SWITCHLY_RATE_LIMIT_EVALUATION_LIMIT:600}
    enabled: ${SWITCHLY_RATE_LIMIT_ENABLED:true}
    login-limit: ${SWITCHLY_RATE_LIMIT_LOGIN_LIMIT:5}
    login-window-seconds: ${SWITCHLY_RATE_LIMIT_LOGIN_WINDOW:60}
    register-limit: ${SWITCHLY_RATE_LIMIT_REGISTER_LIMIT:3}
    register-window-seconds: ${SWITCHLY_RATE_LIMIT_REGISTER_WINDOW:60}
    refresh-limit: ${SWITCHLY_RATE_LIMIT_REFRESH_LIMIT:10}
    refresh-window-seconds: ${SWITCHLY_RATE_LIMIT_REFRESH_WINDOW:60}
    trusted-proxies: ${SWITCHLY_TRUSTED_PROXIES:}

  cors:
    allowed-origins: ${SWITCHLY_CORS_ALLOWED_ORIGINS:}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    allow-credentials: false
    max-age: 3600
